name: restore second-to-last cut reports the active cut count
transcript: synthetic_5min
duration_s: 10.0
steps:
  - ops:
      - {op: cut, target: {kind: time, start: 0.0, end: 1.0, policy: original}}
    expect: {status: applied}
  - ops:
      - {op: restore, target: {kind: cut_ordinal, from_end: 2}}
    expect:
      status: rejected
      error_code: NO_TARGET
      summary_contains: ["Only 1 active cut edit"]
  - ops:
      - {op: restore, target: {kind: cut_ordinal, from_end: two}}
    expect:
      status: rejected
      error_code: INVALID_ARGUMENT
