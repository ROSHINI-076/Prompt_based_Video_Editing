name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BUILDX_BAKE_ENTITLEMENTS_FS: "0"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: incubrix
          POSTGRES_PASSWORD: incubrix
          POSTGRES_DB: incubrix
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      minio:
        image: alpine/minio:latest-release
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --user 0:0
          --health-cmd "wget -q --spider http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Initialize MinIO bucket
        env:
          S3_ENDPOINT: "http://localhost:9000"
          S3_ACCESS_KEY: "minioadmin"
          S3_SECRET_KEY: "minioadmin"
          S3_BUCKET: "incubrix"
        run: python scripts/init_minio.py

      - name: Run tests
        env:
          STT_PROVIDER: mock
          LLM_PROVIDER: mock
          EMBEDDER_PROVIDER: mock
          DATABASE_URL: "postgresql+psycopg2://incubrix:incubrix@localhost:5432/incubrix"
          DATABASE_URL_ASYNC: "postgresql+asyncpg://incubrix:incubrix@localhost:5432/incubrix"
          S3_ENDPOINT: "http://localhost:9000"
          S3_ACCESS_KEY: "minioadmin"
          S3_SECRET_KEY: "minioadmin"
          S3_BUCKET: "incubrix"
          TEST_MODE: "true"
        run: make test
