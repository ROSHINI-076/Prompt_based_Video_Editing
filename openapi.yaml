openapi: 3.1.0
info:
  title: IncuBrix Video Editing Engine
  description: Authenticated prompt-based video editing API.
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      description: Process liveness endpoint.
      operationId: health_health_get
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '401': &id001
          description: Standard API error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405': *id001
        '409': *id001
        '413': *id001
        '422': *id001
        '429': *id001
        '500': *id001
        '503': *id001
  /ready:
    get:
      summary: Ready
      description: Readiness check for Postgres and MinIO.
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '401': *id001
        '405': *id001
        '409': *id001
        '413': *id001
        '422': *id001
        '429': *id001
        '500': *id001
        '503': *id001
  /api/v1/videos/{video_id}:
    get:
      summary: Get Video
      description: Read the persisted video metadata record.
      operationId: get_video_api_v1_videos__video_id__get
      parameters:
      - name: video_id
        in: path
        required: true
        schema:
          type: string
          title: Video Id
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoMetadata'
        '422': *id001
        '401': *id001
        '404': *id001
        '405': *id001
        '409': *id001
        '413': *id001
        '429': *id001
        '500': *id001
        '503': *id001
      security:
      - BearerAuth: []
  /api/v1/videos/{video_id}/transcript:
    get:
      summary: Get Transcript
      description: Return the transcript stored for a source video.
      operationId: get_transcript_api_v1_videos__video_id__transcript_get
      parameters:
      - name: video_id
        in: path
        required: true
        schema:
          type: string
          title: Video Id
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptResponse'
        '422': *id001
        '401': *id001
        '404': *id001
        '405': *id001
        '409': *id001
        '413': *id001
        '429': *id001
        '500': *id001
        '503': *id001
      security:
      - BearerAuth: []
  /api/v1/videos:
    post:
      summary: Create Video
      description: Queue an intake/transcription job from a multipart upload or public URL.
      operationId: create_video_api_v1_videos_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '202':
          description: Video intake and transcription job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '401': *id001
        '404': *id001
        '405': *id001
        '409': *id001
        '413': *id001
        '422': *id001
        '429': *id001
        '500': *id001
        '503': *id001
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoUrlRequest'
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                url:
                  type: string
                  format: uri
                callback_url:
                  type: string
                  format: uri
              oneOf:
              - required:
                - file
              - required:
                - url
  /api/v1/sessions:
    post:
      summary: Create Session
      description: Create a session bound to a previously ingested video.
      operationId: create_session_api_v1_sessions_post
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401': *id001
        '404': *id001
        '405': *id001
        '409': *id001
        '413': *id001
        '422': *id001
        '429': *id001
        '500': *id001
        '503': *id001
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
  /api/v1/sessions/{session_id}:
    get:
      summary: Get Session
      description: Return the current session summary and timeline hash.
      operationId: get_session_api_v1_sessions__session_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '422': *id001
        '401': *id001
        '404': *id001
        '405': *id001
        '409': *id001
        '413': *id001
        '429': *id001
        '500': *id001
        '503': *id001
      security:
      - BearerAuth: []
  /api/v1/sessions/{session_id}/instructions:
    post:
      summary: Post Instruction
      description: Apply a natural-language instruction to a session and persist the new state.
      operationId: post_instruction_api_v1_sessions__session_id__instructions_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 255
      responses:
        '200':
          description: 'Instruction result: applied, needs clarification, or rejected.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructionResult'
        '422': *id001
        '401': *id001
        '404': *id001
        '405': *id001
        '409': *id001
        '413': *id001
        '429': *id001
        '500': *id001
        '503': *id001
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstructionRequest'
  /api/v1/sessions/{session_id}/timeline:
    get:
      summary: Get Timeline
      description: Return the current timeline projection and hash.
      operationId: get_timeline_api_v1_sessions__session_id__timeline_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '422': *id001
        '401': *id001
        '404': *id001
        '405': *id001
        '409': *id001
        '413': *id001
        '429': *id001
        '500': *id001
        '503': *id001
      security:
      - BearerAuth: []
  /api/v1/sessions/{session_id}/history:
    get:
      summary: Get History
      description: Return the active and redo stacks with their instructions.
      operationId: get_history_api_v1_sessions__session_id__history_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '422': *id001
        '401': *id001
        '404': *id001
        '405': *id001
        '409': *id001
        '413': *id001
        '429': *id001
        '500': *id001
        '503': *id001
      security:
      - BearerAuth: []
  /api/v1/sessions/{session_id}/render:
    post:
      summary: Create Render Job
      description: Queue a render job for a session. Rendering is a later phase; jobs fail cleanly.
      operationId: create_render_job_api_v1_sessions__session_id__render_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 255
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422': *id001
        '202':
          description: Render job accepted. Rendering is not implemented until Stage 5.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '401': *id001
        '404': *id001
        '405': *id001
        '409': *id001
        '413': *id001
        '429': *id001
        '500': *id001
        '503': *id001
      security:
      - BearerAuth: []
  /api/v1/jobs/{job_id}:
    get:
      summary: Get Job
      description: Read the current state of a background job.
      operationId: get_job_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '422': *id001
        '401': *id001
        '404': *id001
        '405': *id001
        '409': *id001
        '413': *id001
        '429': *id001
        '500': *id001
        '503': *id001
      security:
      - BearerAuth: []
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Error:
      type: object
      required:
      - code
      - message
      - retryable
      - details
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message:
          type: string
        retryable:
          type: boolean
        details:
          oneOf:
          - type: object
            additionalProperties: true
          - type: array
            items: {}
          - type: string
          - type: number
          - type: boolean
          - type: 'null'
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    VideoMetadata:
      type: object
      required:
      - id
      - sha256
      - duration_s
      - fps
      - has_audio
      - status
      properties:
        id:
          type: string
        sha256:
          type: string
        duration_s:
          type: number
        fps:
          type: number
        has_audio:
          type: boolean
        status:
          type: string
        warnings:
          type: array
          items:
            type: string
        source_key:
          type: string
    TranscriptResponse:
      type: object
      required:
      - video_id
      - transcript
      properties:
        video_id:
          type: string
        transcript:
          type: object
          additionalProperties: true
    SessionResponse:
      type: object
      required:
      - session_id
      - video_id
      - version
      properties:
        session_id:
          type: string
        video_id:
          type: string
        version:
          type: integer
        timeline_hash:
          type: string
        duration_s:
          type: number
    TimelineResponse:
      type: object
      required:
      - source
      - segments
      - overlays
      - timeline_hash
      properties:
        source:
          type: object
          additionalProperties: true
        segments:
          type: array
          items:
            type: object
        overlays:
          type: array
          items:
            type: object
        overlay_displays:
          type: array
          items:
            type: object
        effects:
          type: array
          items:
            type: object
        warnings:
          type: array
          items:
            type: string
        timeline_hash:
          type: string
    HistoryResponse:
      type: object
      required:
      - stack
      - redo
      - edit_counter
      properties:
        stack:
          type: array
          items:
            type: object
        redo:
          type: array
          items:
            type: object
        edit_counter:
          type: integer
    JobResponse:
      type: object
      required:
      - job_id
      - type
      - status
      - progress
      - result
      - error
      properties:
        job_id:
          type: string
        type:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
        progress:
          type: integer
          minimum: 0
          maximum: 100
        result:
          type:
          - object
          - 'null'
          additionalProperties: true
        error:
          type:
          - object
          - 'null'
          additionalProperties: true
        attempts:
          type: integer
        max_attempts:
          type: integer
    JobAccepted:
      type: object
      required:
      - job_id
      properties:
        job_id:
          type: string
    VideoUrlRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
        callback_url:
          type: string
          format: uri
      additionalProperties: false
    SessionRequest:
      type: object
      required:
      - video_id
      properties:
        video_id:
          type: string
      additionalProperties: false
    InstructionRequest:
      type: object
      properties:
        say:
          type: string
        answer:
          type: string
      oneOf:
      - required:
        - say
      - required:
        - answer
      additionalProperties: false
    InstructionResult:
      type: object
      required:
      - status
      - operations
      - summary
      - question
      - options
      - warnings
      properties:
        status:
          type: string
          enum:
          - applied
          - needs_clarification
          - rejected
        operations:
          type: array
          items:
            type: object
        summary:
          type: string
        question:
          type:
          - string
          - 'null'
        options:
          type:
          - array
          - 'null'
          items: {}
        warnings:
          type: array
          items:
            type: string
        timeline_hash:
          type:
          - string
          - 'null'
        duration_s:
          type:
          - number
          - 'null'
        time_policy:
          type:
          - string
          - 'null'
          enum:
          - current
          - original
          - null
        edit_id:
          type:
          - string
          - 'null'
        error:
          type:
          - object
          - 'null'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
